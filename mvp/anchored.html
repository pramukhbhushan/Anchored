<title>Anchored</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Public+Sans:ital,wght@0,400..700;1,400&display=swap">
<style>
/* Layout: a work-order pad. Quiet paper and navy ink everywhere, with one loud device: the carbon-yellow work order and its rubber-stamp verdicts. */
:root{
  --paper:#EDF0EF; --sheet:#FFFFFF; --ink:#17233B; --ink-2:#3B475D; --muted:#636E80; --line:#D2D8DB;
  --carbon:#F4CF48; --carbon-soft:#FBF0BF; --on-carbon:#2A2300;
  --link:#2347B5; --good:#1C7A4C; --good-soft:#DCF0E4; --buy:#2347B5; --buy-soft:#E0E7FA;
  --skip:#788193; --skip-soft:#E9ECEF; --warn:#A4500B; --warn-soft:#FAE8D6;
  --shadow:0 1px 0 rgba(23,35,59,.06), 0 10px 28px -16px rgba(23,35,59,.35);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E131B; --sheet:#151C27; --ink:#E6EBF3; --ink-2:#C2CAD7; --muted:#93A0B3; --line:#283345;
  --carbon:#E7C33F; --carbon-soft:#332D14; --on-carbon:#221C00;
  --link:#9AB2FF; --good:#5DC08E; --good-soft:#15301F; --buy:#9AB2FF; --buy-soft:#1A2547;
  --skip:#8D97A8; --skip-soft:#222A36; --warn:#F0A35A; --warn-soft:#382614;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 12px 30px -16px rgba(0,0,0,.8); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E131B; --sheet:#151C27; --ink:#E6EBF3; --ink-2:#C2CAD7; --muted:#93A0B3; --line:#283345;
  --carbon:#E7C33F; --carbon-soft:#332D14; --on-carbon:#221C00;
  --link:#9AB2FF; --good:#5DC08E; --good-soft:#15301F; --buy:#9AB2FF; --buy-soft:#1A2547;
  --skip:#8D97A8; --skip-soft:#222A36; --warn:#F0A35A; --warn-soft:#382614;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 12px 30px -16px rgba(0,0,0,.8); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--link)}
h1,h2,h3{font-family:var(--display);font-stretch:112%;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(34px,5.4vw,58px);font-weight:850}
h2{font-size:clamp(24px,3vw,32px);font-weight:800}
h3{font-size:19px;font-weight:750}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--carbon);outline-offset:2px;border-radius:4px}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px} .num{font-variant-numeric:tabular-nums}
.stack-y{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.prose{max-width:46em;color:var(--ink-2)}
.prose p+p{margin-top:10px}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.mark{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:22px;letter-spacing:-.02em;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px}
.mark svg{width:22px;height:22px}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav a{padding:6px 10px;border-radius:var(--r);text-decoration:none;color:var(--ink-2);font-weight:600;font-size:15px}
.nav a[aria-current="page"],.nav a:hover{background:var(--sheet);color:var(--ink)}

.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r);font-weight:650;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink)} .btn.ghost:hover{background:var(--sheet)}
.btn.sm{padding:6px 11px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--link);text-decoration:underline;cursor:pointer;font-weight:600}

.hero{padding-block:52px 40px}
.hero .grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:start}
.hero .lede{font-size:19px;color:var(--ink-2);max-width:36em;margin-top:18px}
.hero .ctas{margin-top:26px}
.hero .fine{margin-top:16px;font-size:14px;color:var(--muted)}
@media (max-width:900px){.hero .grid{grid-template-columns:1fr;gap:32px}.hero{padding-block:32px 24px}}
.try{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.try input{flex:1 1 220px;min-width:0;border:1.5px solid var(--line);border-radius:var(--r);padding:9px 12px;background:var(--sheet)}
.try input:focus{border-color:var(--ink);outline:none}
.exlabel{font-size:13.5px;color:var(--muted);margin-bottom:6px}

.wo{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.wo-head{background:var(--carbon);color:var(--on-carbon);padding:12px 18px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.wo-head b{font-family:var(--display);font-stretch:100%;font-weight:850;font-size:17px}
.wo-head span{font-size:13px}
.wo-perf{height:10px;background:radial-gradient(circle at 6px -1px,var(--paper) 4px,transparent 4.5px) 0 0/12px 10px repeat-x,var(--sheet);margin-top:-1px}
.wo-body{padding:6px 18px 18px}
.wo-meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;padding:10px 0 12px;border-bottom:1px dashed var(--line);margin:0}
.wo-meta dt{color:var(--muted)} .wo-meta dd{margin:0;min-width:0}
.wo-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line)}
.wo-line b{display:block;font-size:15.5px}
.wo-line p{font-size:13.5px;color:var(--muted);margin-top:2px}
.wo-foot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding-top:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1.5px solid var(--line);background:var(--sheet);padding:6px 12px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px}
.tab[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}

.stamp{display:inline-block;font-family:var(--display);font-stretch:72%;font-weight:850;text-transform:uppercase;letter-spacing:.07em;font-size:13px;border:2px solid currentColor;border-radius:3px;padding:2px 8px 1px;transform:rotate(-4deg);white-space:nowrap;line-height:1.3}
.stamp.turnon{color:var(--good)} .stamp.buy{color:var(--buy)} .stamp.build{color:var(--ink);background:var(--carbon-soft)} .stamp.skip{color:var(--skip)}
@media (prefers-reduced-motion:no-preference){
  .stamp.fresh{animation:thunk .32s cubic-bezier(.3,1.6,.5,1) both}
  @keyframes thunk{from{transform:rotate(-12deg) scale(1.5);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
}

section.band{padding-block:44px;border-top:1px solid var(--line)}
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;margin:26px 0 0;padding:0;counter-reset:s}
.steps4 li{list-style:none;counter-increment:s}
.steps4 li::before{content:counter(s);font-family:var(--display);font-stretch:125%;font-weight:900;font-size:30px;display:block;line-height:1;margin-bottom:10px}
.steps4 h3{margin-bottom:6px} .steps4 p{color:var(--ink-2);font-size:15px}
@media (max-width:860px){.steps4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.steps4{grid-template-columns:1fr}}
#cases{scroll-margin-top:76px}
.cases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px}
@media (max-width:860px){.cases{grid-template-columns:1fr}}
.case{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.case .who{font-size:13.5px;color:var(--muted)}
.case .stat{font-family:var(--display);font-stretch:100%;font-weight:850;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.case .src{font-size:12.5px;color:var(--muted)}
.case ul{margin:0;padding:10px 0 0;list-style:none;display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line)}
.case li{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14.5px}
.case .go{margin-top:auto;padding-top:6px}
footer{padding-block:28px 40px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}

.appbar{padding-block:22px 6px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.appbar label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.appbar select{padding:8px 10px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--sheet);font-weight:650;max-width:100%}
.stepbar{overflow-x:auto;margin-top:10px;border-bottom:1px solid var(--line)}
.stepbar ol{display:flex;gap:2px;margin:0;padding:0;list-style:none;min-width:max-content}
.stepbar a{display:flex;gap:8px;align-items:center;padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:650;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.stepbar a i{font-style:normal;font-family:var(--display);font-stretch:112%;font-weight:850;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;font-size:12px}
.stepbar a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--carbon)}
.stepbar a[aria-current="page"] i{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.view{padding-block:26px 56px}
.viewhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.viewhead p{color:var(--ink-2);max-width:46em;margin-top:8px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 18px;margin:0}
.kv dt{color:var(--muted);font-size:14px} .kv dd{margin:0}
@media (max-width:520px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:10px}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--skip-soft);font-size:13.5px;font-weight:600}
.chip.new{background:var(--carbon-soft)} .chip.ok{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.notice{border-left:4px solid var(--carbon);background:var(--carbon-soft);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;font-size:14.5px}
.draft{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--paper);font-size:15px;white-space:pre-wrap;display:block}
.grouphead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:26px 0 12px}
.grouphead:first-of-type{margin-top:0}
.grouphead p{font-size:14px;color:var(--muted)}

.mapgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:760px){.mapgrid{grid-template-columns:1fr}}
.opp{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.opp.dim{background:transparent}
.opp header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.opp h3{font-size:17px}
.fitbar{display:flex;gap:3px;margin-top:6px}
.fitbar span{width:18px;height:5px;border-radius:2px;background:var(--line)} .fitbar span.on{background:var(--ink)}
.opp .why{font-size:14.5px;color:var(--ink-2)}
.opp .stake{font-size:13.5px;font-weight:650}
.paths{display:flex;flex-direction:column;gap:6px}
.path{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
.path.chosen{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--carbon)}
.path.none{opacity:.62}
.path .k{font-weight:750;font-size:13px}
.path .v{font-size:14px;min-width:0}
.path .v small{display:block;color:var(--muted);font-size:12.5px}
.opp .foot{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:6px;font-size:14px;color:var(--ink-2)}
.legend span{display:flex;gap:8px;align-items:center}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tools{display:flex;flex-direction:column;gap:10px}
.tool{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:16px;padding:14px 16px;align-items:start}
.score{font-family:var(--display);font-stretch:100%;font-weight:850;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;text-align:center;padding-top:4px}
.score small{display:block;font-family:var(--body);font-weight:600;font-size:11.5px;color:var(--muted);margin-top:4px}
.tool h3{font-size:17px}
.tool .meta{font-size:14px;color:var(--ink-2);margin-top:2px}
.tool details{margin-top:8px}
.tool summary{cursor:pointer;font-size:14px;font-weight:650;color:var(--link)}
.crit{display:grid;grid-template-columns:minmax(120px,200px) 104px minmax(0,1fr);gap:8px 12px;font-size:13.5px;margin-top:10px;align-items:start}
.crit .ev{color:var(--muted)}
.st{font-weight:700;font-size:12.5px;padding:1px 8px;border-radius:999px;text-align:center;white-space:nowrap}
.st.met{background:var(--good-soft);color:var(--good)} .st.partly{background:var(--carbon-soft)} .st.unknown{background:var(--skip-soft);color:var(--ink-2)} .st.no{background:var(--warn-soft);color:var(--warn)}
@media (max-width:640px){.crit{grid-template-columns:minmax(0,1fr) auto}.crit .ev{grid-column:1 / -1;margin-top:-4px}}
.tool .acts{display:flex;flex-direction:column;gap:6px;min-width:130px}
@media (max-width:640px){.tool{grid-template-columns:56px minmax(0,1fr)}.tool .acts{grid-column:1 / -1;flex-direction:row;flex-wrap:wrap;min-width:0}.score{font-size:24px}}
.scroll{overflow-x:auto}
.cmp{margin-bottom:18px}
.cmp table,.plain{border-collapse:collapse;width:100%;font-size:14px}
.cmp table{min-width:600px;background:var(--sheet);border:1px solid var(--line)}
.cmp th,.cmp td,.plain th,.plain td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp th{font-family:var(--display);font-stretch:100%;font-weight:800}
.plain th{font-weight:700;color:var(--muted);font-size:13.5px}
.scroll .plain{min-width:600px}
.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}
.queue article{border:1px dashed var(--line);border-radius:var(--r);padding:12px;font-size:13.5px;min-width:0}
.queue dl{display:grid;grid-template-columns:86px minmax(0,1fr);gap:4px 8px;margin:8px 0 0}
.queue dt{color:var(--muted)} .queue dd{margin:0;overflow-wrap:anywhere}

.layers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:1000px){.layers{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.layers{grid-template-columns:1fr}}
.layer{background:var(--sheet);border:1px solid var(--line);border-top:4px solid var(--ink);border-radius:var(--r);padding:12px 14px;min-width:0;font-size:14px}
.layer h3{font-size:16px}
.layer .tag{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.layer ul{margin:0;padding-left:18px;color:var(--ink-2)}
.layer li+li{margin-top:4px}
.stacktable td.num,.stacktable th.num{text-align:right;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;padding-top:14px}
.total b{font-family:var(--display);font-stretch:100%;font-weight:850;font-size:26px;font-variant-numeric:tabular-nums}
.hood{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
@media (max-width:760px){.hood{grid-template-columns:1fr}}
.hood article{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.hood dl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 12px;font-size:14px;margin:10px 0 0}
.hood dt{color:var(--muted)} .hood dd{margin:0;min-width:0;overflow-wrap:anywhere}
.hood ul,.hood ol{margin:0;padding-left:18px}

.brief{background:var(--carbon-soft);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.brief h3{font-size:17px;margin-bottom:6px}
.brief ul{margin:6px 0 0;padding-left:18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);margin-bottom:18px}
.kpis div{padding:12px 16px;border-right:1px solid var(--line);min-width:0}
.kpis div:last-child{border-right:0}
.kpis b{display:block;font-family:var(--display);font-stretch:100%;font-weight:850;font-size:24px;font-variant-numeric:tabular-nums}
.kpis span{font-size:13px;color:var(--muted)}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis div:nth-child(2){border-right:0}.kpis div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.feed{display:flex;flex-direction:column;gap:12px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.card.done{opacity:.62}
.card .who{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.card .who b{color:var(--ink)}
.card h3{font-size:17px}
.card textarea{width:100%;min-height:96px;border:1.5px solid var(--ink);border-radius:var(--r);padding:10px 12px;background:var(--paper);resize:vertical}
.card .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-weight:700;font-size:14px}
.phone{background:var(--ink);color:var(--paper);border-radius:22px;padding:14px;min-height:340px;display:flex;flex-direction:column;gap:8px}
.phone .bar{display:flex;justify-content:space-between;font-size:12.5px;opacity:.8;padding:0 4px 6px;border-bottom:1px solid rgba(127,127,127,.35)}
.bubble{align-self:flex-end;background:var(--carbon);color:var(--on-carbon);padding:8px 12px;border-radius:14px 14px 4px 14px;font-size:14px;max-width:92%;white-space:pre-wrap}
.bubble small{display:block;font-size:11.5px;opacity:.75;margin-bottom:2px}
.logline{font-size:13.5px;padding:6px 10px;border-radius:8px;background:rgba(127,127,127,.18)}
.phone .empty{opacity:.7;font-size:14px;margin:auto;text-align:center;max-width:24em}

form.ob{display:flex;flex-direction:column;gap:18px}
.field label,.field legend{display:block;font-weight:700;margin-bottom:6px;padding:0}
fieldset.field{border:0;padding:0;margin:0}
.field input[type=text],.field textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--sheet)}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--ink);outline:none}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick label{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:14px;background:var(--sheet);margin:0}
.pick input{accent-color:var(--ink)}
.pick label:has(input:checked){border-color:var(--ink)}
.progress{font-size:15px;font-weight:650}

.cols3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.cols3{grid-template-columns:1fr}}
.roadmap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:860px){.roadmap{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.roadmap{grid-template-columns:1fr}}
.roadmap article{border-top:4px solid var(--ink);background:var(--sheet);padding:14px;border-radius:0 0 var(--r) var(--r)}
.roadmap h3{font-size:16px;margin-bottom:6px}
.roadmap ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2)}
.lanes{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.lane{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.lane h3{font-size:14px;font-family:var(--body);font-weight:700;color:var(--muted);margin-bottom:8px}
.lane ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lane li{display:flex;align-items:center;gap:8px;min-width:0}
.lane li+li::before{content:"\2192";color:var(--muted)}
.node{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:6px 10px;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.node.core{background:var(--carbon);border-color:var(--carbon);color:var(--on-carbon)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r);font-weight:650;box-shadow:var(--shadow);z-index:40;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================================================================ helpers */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const money = n => "$" + (Math.round(n*100)/100).toLocaleString("en-US",{maximumFractionDigits:2});
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600); }
const stamp = (v, fresh) => `<span class="stamp ${v}${fresh?" fresh":""}">${esc(PATH[v]||v)}</span>`;
const fitBar = n => `<span class="fitbar" aria-label="Fit ${n} of 3">${[1,2,3].map(i=>`<span class="${i<=n?"on":""}"></span>`).join("")}</span>`;
const toolName = t => norm(t.name).includes(norm(t.maker)) ? t.name : t.maker+" "+t.name;
const uses = (b, name) => (b.tools||[]).some(x=>{ const a=norm(x), z=norm(name); return a && z && (a.includes(z)||z.includes(a)); });
const toolCost = (t, b) => t.monthly==null ? null : t.monthly*(t.perUser?(b.seats||1):1);
const wfList = b => WF_IDS.filter(k=>b.wfs[k]);

/* Rate a tool for one business: seven criteria, each with a status and an evidence level. Computed in code. */
function rate(t, b){
  const r = {};
  if (t.platform && uses(b,t.platform)) r.connects = ["met","ours","Part of "+t.platform+", which you use"];
  else if (t.platform) r.connects = ["no","ours","Needs "+t.platform+", which you don't use"];
  else if (t.connects && t.connects.length){ const hit = t.connects.find(x=>uses(b,x)); r.connects = hit ? ["met","page","Works with "+hit+", which you use"] : ["no","page","Names "+t.connects.slice(0,4).join(", ")+". None is in your setup"]; }
  else r.connects = ["unknown","none","Doesn't name the software it works with"];
  r.price = t.p; r.charge = t.o; r.data = t.d;
  r.start = t.s || ["unknown","pilot","No vendor publishes a setup time. A timed pilot setup will settle it"];
  const other = (b.langs||["English"]).filter(l=>l!=="English");
  if (!t.l) r.langs = ["unknown","none", t.lnote || "Languages not named"];
  else if (!other.length) r.langs = ["met","page","Names "+t.l.join(", ")];
  else { const miss = other.filter(l=>!t.l.includes(l)); r.langs = miss.length ? ["no","page","Doesn't name "+miss.join(" or ")] : ["met","page","Names "+other.join(" and ")]; }
  const fits = t.for.includes(b.tradeKey) || t.for.includes("any");
  r.proven = fits ? ["unknown","pilot","Built for businesses like yours. No 30-day results published yet"] : ["no","ours","Built for "+t.for.join(" and ")+" businesses"];
  const w = {connects:25, price:20, charge:15, data:15, start:10, proven:10, langs: other.length?15:5};
  let num=0, den=0; for (const c of CRIT){ num += w[c.k]*VAL[r[c.k][0]]; den += w[c.k]; }
  return {total:Math.round(100*num/den), r, met:CRIT.filter(c=>r[c.k][0]==="met").length, unknown:CRIT.filter(c=>r[c.k][0]==="unknown").length};
}

/* The three paths for one workflow. */
function options(b, wf){
  const owned = TOOLS.filter(t=>t.wfs.includes(wf) && t.platform && !t.addon && uses(b,t.platform));
  const buy = TOOLS.filter(t=>t.wfs.includes(wf) && !owned.includes(t) && (t.for.includes(b.tradeKey) || t.for.includes("any"))).map(t=>({t, sc:rate(t,b)})).sort((a,z)=>z.sc.total-a.sc.total);
  const x = b.wfs[wf] || {};
  const agents = ((x.agents && x.agents.length) ? x.agents : WF_BUILD[wf] || []).filter(a=>AGENTS[a]);
  return {owned, buy, agents};
}
function choiceOf(b, wf){
  const c = (state.choices[b.id] ||= {});
  if (c[wf]) return c[wf];
  const x = b.wfs[wf], o = options(b, wf);
  let ch = {path:"skip"};
  if (x.rec==="turnon" && o.owned.length) ch = {path:"turnon", id:(x.tool && o.owned.find(t=>t.id===x.tool) ? x.tool : o.owned[0].id)};
  else if (x.rec==="build" && o.agents.length) ch = {path:"build", agents:o.agents};
  else if ((x.rec==="buy" || x.rec==="turnon") && (x.tool || o.buy.length)) ch = {path:"buy", id:x.tool || o.buy[0].t.id};
  return c[wf] = ch;
}
function setChoice(wf, path, id){
  const b = curBiz(), o = options(b, wf);
  const ch = path==="build" ? {path, agents:o.agents} : path==="skip" ? {path} : {path, id};
  (state.choices[b.id] ||= {})[wf] = ch; save();

}
function chosenAgents(b){ return [...new Set(wfList(b).flatMap(k=>{ const c=choiceOf(b,k); return c.path==="build" ? c.agents : []; }))]; }
function chosenTools(b){ return wfList(b).map(k=>({wf:k, c:choiceOf(b,k)})).filter(x=>x.c.path==="turnon"||x.c.path==="buy").map(x=>({wf:x.wf, path:x.c.path, t:TOOLS.find(t=>t.id===x.c.id)})).filter(x=>x.t); }
function stackCost(b){
  const seen = new Set(); let sum = 0; const quote = [];
  for (const {path,t} of chosenTools(b)){ if (seen.has(t.id)) continue; seen.add(t.id); if (path==="turnon") continue; const c = toolCost(t,b); c==null ? quote.push(t) : sum += c; }
  const plan = chosenAgents(b).length ? 29 : 0;
  return {sum, plan, total:sum+plan, quote};
}

/* ================================================================ rules engine for any business */
function engineWfs(p){
  const r = x => (p.reach||[]).includes(x), sg = x => (p.signals||[]).includes(x), has = x => (p.tools||[]).some(y=>norm(y).includes(norm(x)));
  const leadsIn = r("Website form") || r("Instagram or Facebook") || r("Email");
  const w = {};
  w.calls = r("Phone calls") ? {fit:3, why:"Customers reach you by phone. A missed call often turns into a call to someone else."} : {fit:0, why:"Customers don't usually reach you by phone."};
  w.books = has("QuickBooks") ? {fit:2, why:"You already pay for QuickBooks. Use what it does before you buy more."} : (sg("quotes")||sg("appointments")) ? {fit:2, why:"You bill after the work is done, and late invoices need a polite nudge."} : {fit:1, why:"Customers pay at the counter."};
  w.leads = (leadsIn || sg("quotes")) ? {fit:3, why: leadsIn ? "New inquiries arrive in forms and messages while you're busy." : "People ask for prices and wait to hear back."} : {fit:1, why:"Most sales happen on the spot, with no lead to chase."};
  w.social = sg("marketing") ? {fit:1, why:"You already post or advertise. A post drafter can come later."} : {fit:2, isNew:true, why:"You don't post or advertise today. Short posts and listing updates are a cheap place to start."};
  w.quotes = sg("quotes") ? {fit:3, why:"You send quotes, and quotes go quiet when nobody has time to chase them."} : {fit:0, why:"You don't write custom quotes."};
  if (sg("suppliers")) w.invoices = {fit:3, why:"You buy from suppliers. Price rises on invoices pass unseen until margins shrink."};
  if (r("Delivery apps")) w.disputes = {fit:2, why:"Delivery apps take refunds out of payouts unless someone disputes them."};
  if (sg("appointments")) w.noshows = {fit:3, why:"Customers book ahead, and a no-show costs you the slot."};
  if (sg("shifts")) w.scheduling = {fit:2, why:"Staff work shifts, and gaps get filled by text at the last minute."};
  if (r("Google")) w.reviews = {fit:2, agents:[(sg("appointments")||sg("quotes"))?"reviewer":"reviewdrafter"], why:"New customers find you on Google, where reviews and replies shape who calls."};
  if (sg("catering")) w.catering = {fit:3, why:"Catering and event requests are worth many single orders."};
  if (sg("snap")) w.snap = {fit:3, why:"USDA's new SNAP stocking rule took effect Nov 4, 2026. USDA estimated 73% of convenience stores fell short under the proposed rule."};
  if (sg("licenses")) w.licenses = {fit:2, why:"Licenses and permits renew on different calendars."};
  if (sg("memberships")) w.memberships = {fit:2, why:"Plans and memberships lapse when nobody reminds the customer."};
  if (r("Referrals") && (sg("appointments")||sg("quotes"))) w.referrals = {fit:2, isNew:true, why:"Referrals already bring you work. Asking at the right moment brings more."};
  const shell = {tools:p.tools, wfs:w, tradeKey:p.tradeKey, langs:p.langs, seats:p.seats};
  for (const k in w){ const x = w[k]; x.stake = ""; if (x.fit<=1){ x.rec = "skip"; continue; } const o = options(shell,k); x.rec = o.owned.length ? "turnon" : o.agents.length ? "build" : o.buy.length ? "buy" : "skip"; }
  return w;
}
function tasksFrom(p){

function profileFrom(p){
  return {id:p.id || ("my-"+Date.now()), custom:true, builtBy:p.builtBy||"rules", name:p.name||"Your business", trade:p.trade||"Small business", tradeKey:p.tradeKey||"any", place:p.place||"Not given", size:p.size||"Not given", seats:p.seats||3, revenue:p.revenue||"Not given", customers:p.customers||"Not given", langs:(p.langs&&p.langs.length)?p.langs:["English"], reach:(p.reach&&p.reach.length)?p.reach:["Not given"], tools:(p.tools&&p.tools.length)?p.tools:["Paper and phone"], signals:p.signals||[], tasks:(p.tasks&&p.tasks.length)?p.tasks:tasksFrom(p), voice:p.voice||("Thanks for reaching out to "+(p.name||"us")+"!"), wfs:engineWfs(p)};

function detectTradeKey(text){

  if (/restaurant|cafe|coffee|bakery|food|kitchen|diner|pizza|taco|catering|truck/.test(t)) return "restaurant";
  if (/corner store|bodega|deli|mart|grocery|convenience/.test(t)) return "store";
  if (/coach|consult|tutor|trainer|therap|counsel|teacher/.test(t)) return "coach";

}
function profileFromText(txt){

  reach.push("Google");
  const signals = [];

  if (has(/appointment|book|session|lesson|class|patient|client|groom|salon|tutor|clinic|consult|reserv/)) signals.push("appointments");
  if (has(/supplier|wholesale|inventory|ingredient|stock|parts|food|bake|bakery|restaurant|truck|store|shop|market|cafe|florist|repair/)) signals.push("suppliers");
  if (has(/staff|employee|crew|shift|team|cooks?\b|workers/)) signals.push("shifts");

function feed(b){

  for (const a of ag){ const base = (b.cards && b.cards[a]) || (CARD_TPL[a] && CARD_TPL[a](b,0)); if (base) list.push({...base, agent:a, key:b.id+":"+a}); }

  (state.extra[b.id]||[]).forEach(c=>{ if (ag.includes(c.agent)) list.unshift(c); });
  return list.map(c=>({...c, ...(state.cs[c.key] ||= {status:"pending", created:Date.now(), edited:false})}));
}

function brief(b){
  const cards = feed(b), pending = cards.filter(c=>c.status==="pending");

function cardHTML(c){
  const a = c.agent && AGENTS[c.agent];
  const head = `<div class="who"><span><b>${esc(a?a.name:"Anchored")}</b>${c.channel==="locked"?" locked this thread":" drafted this"}</span><span>${c.to?"To "+esc(c.to):""}</span></div><h3>${esc(c.title)}</h3>`;
  const body = c.body;
  if (c.status!=="pending"){ const label = c.status==="skipped" ? "Skipped" : c.channel==="locked" ? "Yours to handle" : c.edited ? "Approved with your edits" : "Approved"; return `<article class="card done">${head}<p class="draft">${esc(body)}</p><p class="status">${label}</p></article>`; }
  return `<article class="card">${head}
    ${c.editing?`<label class="tiny muted" for="ed-${esc(c.key)}">Edit the draft</label><textarea id="ed-${esc(c.key)}">${esc(body)}</textarea>`:`<p class="draft">${esc(body)}</p>`}

      : `<button class="btn sm" data-act="approve" data-key="${esc(c.key)}">Approve: ${esc(c.action)}</button><button class="btn sm ghost" data-act="edit" data-key="${esc(c.key)}">Edit</button><button class="btn sm ghost" data-act="skip" data-key="${esc(c.key)}">Skip</button>${state.ai==="on"&&c.channel!=="list"?`<button class="linkbtn small" data-act="voice" data-key="${esc(c.key)}">Rewrite in my voice</button>`:""}`}
    </div><p class="tiny muted" data-note="${esc(c.key)}"></p></article>`;
}
function decide(key, status, newBody){
  const b = curBiz(), c = feed(b).find(x=>x.key===key); if(!c) return; const cs = state.cs[key];
  if (newBody!=null && newBody.trim() && newBody.trim()!==c.body){ cs.body = newBody.trim(); cs.edited = true; }
  cs.status = status; cs.decidedAt = Date.now(); cs.editing = false;
  const body = cs.body || c.body;
  if (status==="approved" && c.channel!=="locked"){ const log = logOf(b);
    if (c.channel==="sms") log.unshift({channel:"sms", to:c.to||"customer", body});
    else if (c.channel==="email") log.unshift({channel:"email", text:"Email to "+(c.to||"customer")+": "+c.title});
    else log.unshift({channel:"list", text:c.action+": "+c.title}); }
  toast(status==="approved" ? (c.channel==="locked"?"Marked as yours":"Approved. "+(c.channel==="sms"?"Text shown on the simulated phone.":"Logged in the outbox.")) : "Skipped");
  render();
}

  <div class="stack-y"><div class="panel"><h3>What happens next</h3><ol style="margin:10px 0 0;padding-left:20px;color:var(--ink-2)"><li>Anchored writes a one-page profile you confirm.</li><li>You get the five shared workflows, plus the ones your answers add.</li><li>Each workflow gets three paths and our pick.</li><li>Agents you choose start drafting cards for you to approve.</li></ol></div>
  <div class="notice">Nothing you type leaves this page except to Claude, and nothing is texted to anyone. This is a prototype.</div></div>
  </div>`;
}
function readForm(form){
  const all = n => [...form.querySelectorAll('input[name="'+n+'"]:checked')].map(i=>i.value);
  return {name:$("#ob-name").value.trim(), kind:$("#ob-kind").value.trim(), what:$("#ob-what").value.trim(), week:$("#ob-week").value.trim(), voice:$("#ob-voice").value.trim(), reach:all("reach"), tools:all("tools"), signals:all("signals"), langs:all("langs")};
}
function fromAnswers(ans){
  const [name, ...pl] = ans.name.split(",");
  return profileFrom({name:name.trim()||"Your business", place:pl.join(",").trim(), trade:ans.kind||"Small business", tradeKey:detectTradeKey(ans.kind+" "+ans.what),
    size:(ans.what.match(/crew of \d+[^,.]*|\d+ (people|staff|employees|stylists|tutors|cleaners)/i)||["Not given"])[0], seats:4,
    customers:"From your answers: "+ans.what.slice(0,90), reach:ans.reach, tools:ans.tools, signals:ans.signals, langs:ans.langs,
    tasks:ans.week.split(/,|\band\b/).map(x=>x.trim()).filter(x=>x.length>3).slice(0,5), voice:ans.voice});
}
async function withClaude(ans, base){
  const prompt = `You help set up Anchored, which helps a small business adopt AI. Anchored's rules already mapped this business. Improve the plain-language parts using the owner's answers. Reply with only one JSON object, no other text, in this shape:
{"trade":string (2 to 5 words),"customers":string,"size":string,"tasks":[up to 5 short strings],"voice":one sentence in the owner's voice,"why":{WORKFLOW_ID: string under 24 words, for each workflow listed below},"isNew":[workflow ids the owner does not do today but could]}
Rules: never invent statistics, prices or dollar figures. Speak to the owner as "you". Keep each reason specific to this business.
Workflows: ${wfList(base).map(k=>k+" ("+WF[k].name+", our pick: "+PATH[base.wfs[k].rec]+")").join("; ")}

Owner's answers:
Business: ${ans.name}
Kind of business: ${ans.kind}
What they sell: ${ans.what}
How customers reach them: ${ans.reach.join(", ")}
Tools today: ${ans.tools.join(", ")}
Facts they checked: ${ans.signals.map(id=>SIGNALS.find(x=>x.id===id)?.label).filter(Boolean).join(", ")}
What eats their week: ${ans.week}
A reply in their voice: ${ans.voice}`;
  const r = await state.sample.json(prompt, {modelTier:"default"});
  const str = (v, d) => typeof v==="string" && v.trim() ? v.trim().slice(0,240) : d;
  const b = {...base, builtBy:"claude", trade:str(r?.trade, base.trade), customers:str(r?.customers, base.customers), size:str(r?.size, base.size), voice:str(r?.voice, base.voice)};
  if (Array.isArray(r?.tasks)) b.tasks = r.tasks.filter(x=>typeof x==="string"&&x.trim()).map(x=>x.trim().slice(0,80)).slice(0,5);
  for (const k of wfList(b)){ b.wfs[k] = {...b.wfs[k], why:str(r?.why?.[k], b.wfs[k].why)}; if (Array.isArray(r?.isNew)) b.wfs[k].isNew = r.isNew.includes(k) || !!b.wfs[k].isNew; }
  return b;
}
async function submitOnboard(form){
  const ans = readForm(form);
  if (!ans.name || !ans.kind){ $("#ob-progress").textContent = "Add your business name and what kind of business it is, then try again."; return; }
  $("#ob-go").disabled = true;
  let biz = fromAnswers(ans);
  if (state.ai==="on"){
    $("#ob-progress").textContent = "Claude is reading your answers. This can take up to a minute.";
    try { biz = await withClaude(ans, biz); }
    catch(e){ if (e && (e.code==="not_granted"||e.code==="sampling_disabled")) state.ai = "off"; }
  }
  state.custom.push(biz); state.biz = biz.id; save();
  location.hash = "#profile"; toast("Plan built for "+biz.name);
}
async function rewriteVoice(key){
  const b = curBiz(), c = feed(b).find(x=>x.key===key); if(!c || !state.sample) return;
  const note = document.querySelector(`[data-note="${CSS.escape(key)}"]`); if(note) note.textContent = "Rewriting in your voice...";
  try{
    const {text} = await state.sample(`Rewrite this message so it sounds like the owner of ${b.name}, a ${b.trade}. Their voice sample: "${b.voice}". Keep every fact, time and amount exactly. Do not add prices, offers or promises. Keep it under 60 words. If the original ends with "Reply STOP to opt out." keep that ending. Reply with only the rewritten message.\n\nMessage:\n${c.body}`, {modelTier:"quick", cache:false});
    const cs = state.cs[key]; cs.body = text.trim().replace(/^"|"$/g,""); cs.edited = true; render();
  }catch(e){ if(note) note.textContent = e?.code==="not_granted" ? "Claude isn't allowed for this page, so the draft stays as written." : "Couldn't rewrite right now. The draft is unchanged."; if(e?.code==="not_granted") state.ai = "off"; }
}

    <div class="panel"><h3>Many tools at once</h3><p class="small" style="margin-top:6px;color:var(--ink-2)">The stack view lists every workflow and its chosen path, with the total monthly cost and an under-the-hood panel for each tool and agent.</p></div>
    <div class="panel"><h3>How to engage</h3><p class="small" style="margin-top:6px;color:var(--ink-2)">Each tool and agent comes with setup steps, and every stack links to free help from the local Small Business Development Center, an SBA program.</p></div>

  <section class="band" style="margin-top:36px"><h2>Five layers</h2>

  </section>
  <section class="band"><h2>Architecture</h2>
    <p class="prose" style="margin-top:8px">One Next.js app on Vercel, Supabase Postgres for every business's data, and the Claude API for reading and drafting. A new kind of business needs no new code, and a new tool is one row of data.</p>
    <div class="lanes">
      <div class="lane"><h3>Every event, such as a missed call or a new invoice</h3><ol><li><span class="node">Owner's phone</span></li><li><span class="node">Next.js on Vercel</span></li><li><span class="node">Supabase Postgres, row-level security per business</span></li><li><span class="node">Agent worker with Claude: Haiku, Sonnet or Opus by task</span></li><li><span class="node">Card</span></li><li><span class="node core">Owner approves</span></li><li><span class="node">Executor in code checks rules, then sends</span></li></ol></div>
      <div class="lane"><h3>Every week, for the catalog</h3><ol><li><span class="node">Discovery agent searches per workflow</span></li><li><span class="node">Review queue</span></li><li><span class="node">A person checks price, contract and data terms</span></li><li><span class="node">Catalog with evidence levels</span></li><li><span class="node core">Seven checks, scored in code per business</span></li></ol></div>
    </div>
    <div class="scroll" style="margin-top:16px"><table class="plain"><thead><tr><th>Choice</th><th>Why it scales</th></tr></thead><tbody>
      <tr><td>Signals, not trade templates</td><td>Onboarding answers add workflows. A dental office, a bakery and an auto shop run through the same rules. Case studies add researched numbers on top.</td></tr>
      <tr><td>Three paths per workflow</td><td>Anchored recommends what a business already pays for before it sells anything, and builds an agent only where no tool fits.</td></tr>

    </tbody></table></div>
  </section>
  <section class="band"><h2>What's real in this prototype</h2>
    <div class="scroll" style="margin-top:12px"><table class="plain"><thead><tr><th>Part</th><th>Status</th></tr></thead><tbody>

  <section class="band"><h2>The research behind it</h2>

      <article><h3>Weeks 13 to 16: proof</h3><ul><li>Dollars acted on per business, measured</li><li>Pricing test at $29 a month</li><li>Security review and audit log</li></ul></article>

/* ================================================================ events and routing */
document.addEventListener("click", e=>{
  const t = e.target.closest("button, a"); if(!t) return;
  const d = t.dataset;
  if (d.ex){ state.heroEx = d.ex; render(); return; }
  if (d.openHero){ openHero(); return; }
  if (d.case){ state.biz = d.case; save(); location.hash = "#map"; return; }
  if (d.choose){ const [wf, path, id] = d.choose.split("|"); setChoice(wf, path, id); return; }
  if (d.filter){ state.filter = d.filter; if (state.view!=="compare") location.hash = "#compare"; else render(); return; }
  if (d.cmp){ const i = state.compare.indexOf(d.cmp); if (i<0){ state.compare.push(d.cmp); if (state.compare.length>3) state.compare.shift(); } else state.compare.splice(i,1); render(); if (state.compare.length>=2) $(".cmp")?.scrollIntoView({block:"nearest"}); return; }
  if (d.sim){ const b = curBiz(), ag = chosenAgents(b).filter(a=>CARD_TPL[a]); if (!ag.length) return; const a = ag[simSeq % ag.length]; simSeq++; (state.extra[b.id] ||= []).push({...CARD_TPL[a](b, simSeq), agent:a, key:b.id+":sim:"+simSeq}); toast("New card from "+AGENTS[a].name); render(); return; }
  if (d.act){ const key = d.key, cs = state.cs[key];
    if (d.act==="approve") decide(key,"approved");
    else if (d.act==="skip") decide(key,"skipped");
    else if (d.act==="edit"){ cs.editing = true; render(); document.getElementById("ed-"+key)?.focus(); }
    else if (d.act==="cancel"){ cs.editing = false; render(); }
    else if (d.act==="save") decide(key,"approved", document.getElementById("ed-"+key)?.value);
    else if (d.act==="voice") rewriteVoice(key); }
});
document.addEventListener("change", e=>{ if (e.target.id==="biz-select"){ const v = e.target.value; if (v==="__new"){ location.hash = "#onboard"; return; } state.biz = v; state.compare = []; state.filter = "all"; save(); render(); } });
document.addEventListener("submit", e=>{
  if (e.target.id==="ob"){ e.preventDefault(); submitOnboard(e.target); }
  if (e.target.id==="try"){ e.preventDefault(); const txt = $("#try-text").value.trim(); if (!txt) return; state.heroText = txt; state.heroCustom = profileFromText(txt); state.heroEx = "custom"; render(); }
});
function route(){
  const h = (location.hash||"#home").slice(1), anchor = h==="cases";
  state.view = anchor ? "home" : (VIEWS.includes(h) ? h : "home");
  render();
  if (anchor) document.getElementById("cases")?.scrollIntoView(); else window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();
(async()=>{
  try{ const s = window.claude && await window.claude.use("sample"); state.sample = s || null; state.ai = s ? "on" : "off"; }
  catch(e){ state.ai = "off"; }
  if (["onboard","agents"].includes(state.view)) render();
})();
