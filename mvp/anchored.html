<title>Anchored</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Public+Sans:ital,wght@0,400..700;1,400&display=swap">
<style>
/* Layout: a work-order pad. Quiet paper and navy ink everywhere, with one loud device: the carbon-yellow work order and its rubber-stamp verdicts. */
:root{
  --paper:#EDF0EF; --sheet:#FFFFFF; --ink:#17233B; --ink-2:#3B475D; --muted:#636E80; --line:#D2D8DB;
  --carbon:#F4CF48; --carbon-soft:#FBF0BF; --on-carbon:#2A2300;
  --link:#2347B5; --good:#1C7A4C; --good-soft:#DCF0E4; --buy:#2347B5; --buy-soft:#E0E7FA;
  --skip:#788193; --skip-soft:#E9ECEF; --warn:#A4500B; --warn-soft:#FAE8D6; --bad:#B42318;
  --shadow:0 1px 0 rgba(23,35,59,.06), 0 10px 28px -16px rgba(23,35,59,.35);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E131B; --sheet:#151C27; --ink:#E6EBF3; --ink-2:#C2CAD7; --muted:#93A0B3; --line:#283345;
  --carbon:#E7C33F; --carbon-soft:#332D14; --on-carbon:#221C00;
  --link:#9AB2FF; --good:#5DC08E; --good-soft:#15301F; --buy:#9AB2FF; --buy-soft:#1A2547;
  --skip:#8D97A8; --skip-soft:#222A36; --warn:#F0A35A; --warn-soft:#382614; --bad:#FF8A7A;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 12px 30px -16px rgba(0,0,0,.8); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E131B; --sheet:#151C27; --ink:#E6EBF3; --ink-2:#C2CAD7; --muted:#93A0B3; --line:#283345;
  --carbon:#E7C33F; --carbon-soft:#332D14; --on-carbon:#221C00;
  --link:#9AB2FF; --good:#5DC08E; --good-soft:#15301F; --buy:#9AB2FF; --buy-soft:#1A2547;
  --skip:#8D97A8; --skip-soft:#222A36; --warn:#F0A35A; --warn-soft:#382614; --bad:#FF8A7A;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 12px 30px -16px rgba(0,0,0,.8); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--link)}
h1,h2,h3{font-family:var(--display);font-stretch:112%;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(34px,5.4vw,58px);font-weight:850}
h2{font-size:clamp(24px,3vw,32px);font-weight:800}
h3{font-size:19px;font-weight:750}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--carbon);outline-offset:2px;border-radius:4px}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.stack-y{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.mark{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:22px;letter-spacing:-.02em;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px}
.mark svg{width:22px;height:22px}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav a{padding:6px 10px;border-radius:var(--r);text-decoration:none;color:var(--ink-2);font-weight:600;font-size:15px}
.nav a[aria-current="page"],.nav a:hover{background:var(--sheet);color:var(--ink)}

.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r);font-weight:650;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--sheet)}
.btn.sm{padding:6px 11px;font-size:14px}
.btn.carbon{background:var(--carbon);border-color:var(--carbon);color:var(--on-carbon)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--link);text-decoration:underline;cursor:pointer;font-weight:600}

/* hero */
.hero{padding-block:56px 40px}
.hero .grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:start}
.hero .lede{font-size:19px;color:var(--ink-2);max-width:36em;margin-top:18px}
.hero .ctas{margin-top:26px}
.hero .fine{margin-top:16px;font-size:14px;color:var(--muted)}
@media (max-width:900px){.hero .grid{grid-template-columns:1fr;gap:32px}.hero{padding-block:32px 24px}}

/* work order: the one loud device */
.wo{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden}
.wo-head{background:var(--carbon);color:var(--on-carbon);padding:12px 18px 16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.wo-head b{font-family:var(--display);font-stretch:100%;font-weight:850;font-size:17px}
.wo-head span{font-size:13px;font-variant-numeric:tabular-nums}
.wo-perf{height:10px;background:radial-gradient(circle at 6px -1px,var(--paper) 4px,transparent 4.5px) 0 0/12px 10px repeat-x,var(--sheet);margin-top:-1px}
.wo-body{padding:6px 18px 18px}
.wo-meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;padding:10px 0 12px;border-bottom:1px dashed var(--line)}
.wo-meta dt{color:var(--muted)}
.wo-meta dd{margin:0;min-width:0}
.wo-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.wo-line:last-child{border-bottom:0}
.wo-line b{display:block;font-size:15.5px}
.wo-line p{font-size:13.5px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1.5px solid var(--line);background:var(--sheet);padding:6px 12px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px}
.tab[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}

.stamp{display:inline-block;font-family:var(--display);font-stretch:72%;font-weight:850;text-transform:uppercase;letter-spacing:.07em;font-size:13px;border:2px solid currentColor;border-radius:3px;padding:2px 8px 1px;transform:rotate(-4deg);white-space:nowrap;line-height:1.3}
.stamp.turnon{color:var(--good)}
.stamp.buy{color:var(--buy)}
.stamp.build{color:var(--ink);background:var(--carbon-soft)}
.stamp.skip{color:var(--skip)}
@media (prefers-reduced-motion:no-preference){
  .stamp.fresh{animation:thunk .32s cubic-bezier(.3,1.6,.5,1) both}
  @keyframes thunk{from{transform:rotate(-12deg) scale(1.5);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
}

/* sections */
section.band{padding-block:44px;border-top:1px solid var(--line)}
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;margin-top:26px;counter-reset:s}
.steps4 li{list-style:none;counter-increment:s}
.steps4 li::before{content:counter(s);font-family:var(--display);font-stretch:125%;font-weight:900;font-size:30px;color:var(--ink);display:block;line-height:1;margin-bottom:10px;-webkit-text-stroke:0}
.steps4 h3{margin-bottom:6px}
.steps4 p{color:var(--ink-2);font-size:15px}
.steps4{padding:0;margin-bottom:0}
@media (max-width:860px){.steps4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.steps4{grid-template-columns:1fr}}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:22px;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
.facts div{padding:16px 18px;border-right:1px solid var(--line);min-width:0}
.facts div:last-child{border-right:0}
.facts b{display:block;font-family:var(--display);font-stretch:100%;font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.facts span{font-size:14px;color:var(--ink-2);display:block;margin-top:4px}
.facts em{font-style:normal;font-size:12.5px;color:var(--muted);display:block;margin-top:6px}
@media (max-width:860px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.facts div:nth-child(2){border-right:0}.facts div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:480px){.facts{grid-template-columns:1fr}.facts div{border-right:0;border-bottom:1px solid var(--line)}.facts div:last-child{border-bottom:0}}
footer{padding-block:28px 40px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}

/* app chrome */
.appbar{padding-block:22px 6px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.appbar label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.appbar select{padding:8px 10px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--sheet);font-weight:650;max-width:100%}
.stepbar{overflow-x:auto;margin-top:10px;border-bottom:1px solid var(--line)}
.stepbar ol{display:flex;gap:2px;margin:0;padding:0;list-style:none;min-width:max-content}
.stepbar a{display:flex;gap:8px;align-items:center;padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:650;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.stepbar a i{font-style:normal;font-family:var(--display);font-stretch:112%;font-weight:850;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;font-size:12px}
.stepbar a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--carbon)}
.stepbar a[aria-current="page"] i{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.view{padding-block:26px 56px}
.viewhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.viewhead p{color:var(--ink-2);max-width:44em;margin-top:8px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 18px}
.kv dt{color:var(--muted);font-size:14px}
.kv dd{margin:0}
@media (max-width:520px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:10px}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--skip-soft);font-size:13.5px;font-weight:600}
.chip.new{background:var(--carbon-soft)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.notice{border-left:4px solid var(--carbon);background:var(--carbon-soft);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;font-size:14.5px}

/* map */
.mapgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:960px){.mapgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.mapgrid{grid-template-columns:1fr}}
.opp{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.opp.fit-none,.opp.fit-low{background:transparent}
.opp header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.opp h3{font-size:17px}
.fitbar{display:flex;gap:3px;margin-top:6px}
.fitbar span{width:18px;height:5px;border-radius:2px;background:var(--line)}
.fitbar span.on{background:var(--ink)}
.opp .why{font-size:14.5px;color:var(--ink-2)}
.opp .stake{font-size:13.5px;font-weight:650}
.opp footer{all:unset;display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px;font-size:14px;color:var(--ink-2)}
.legend span{display:flex;gap:8px;align-items:center}

/* compare */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tools{display:flex;flex-direction:column;gap:10px}
.tool{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:16px;padding:14px 16px;align-items:start}
.score{font-family:var(--display);font-stretch:100%;font-weight:850;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;text-align:center;padding-top:4px}
.score small{display:block;font-family:var(--body);font-weight:600;font-size:11.5px;color:var(--muted);margin-top:4px;letter-spacing:0}
.tool h3{font-size:17px}
.tool .meta{font-size:14px;color:var(--ink-2);margin-top:2px}
.tool details{margin-top:8px}
.tool summary{cursor:pointer;font-size:14px;font-weight:650;color:var(--link)}
.factors{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 44px;gap:6px 12px;margin-top:10px;font-size:13.5px;align-items:center}
.factors .bar{height:8px;background:var(--skip-soft);border-radius:4px;overflow:hidden}
.factors .bar i{display:block;height:100%;background:var(--ink)}
.factors .why{grid-column:2 / 4;color:var(--muted);font-size:12.5px;margin-top:-4px;margin-bottom:4px}
.tool .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:130px}
@media (max-width:640px){.tool{grid-template-columns:56px minmax(0,1fr)}.tool .acts{grid-column:1 / -1;flex-direction:row;flex-wrap:wrap;min-width:0}.score{font-size:24px}}
.cmp{overflow-x:auto;margin-bottom:18px}
.cmp table{border-collapse:collapse;width:100%;min-width:560px;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);font-size:14px}
.cmp th,.cmp td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.cmp th{font-family:var(--display);font-stretch:100%;font-weight:800}
.cmp td.num,.cmp th.num{font-variant-numeric:tabular-nums}
.disc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px}
.disc div{border:1px dashed var(--line);border-radius:var(--r);padding:12px;font-size:14px;min-width:0}
@media (max-width:760px){.disc{grid-template-columns:1fr}}

/* stack */
.flow{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1.05fr) 28px minmax(0,1.3fr) 28px minmax(0,.9fr);align-items:stretch;gap:0}
.flow .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.flow .col h3{font-size:14px;font-family:var(--body);font-weight:700;color:var(--muted);margin-bottom:2px}
.flow .arrow{display:grid;place-items:center;color:var(--muted)}
.node{border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:8px 10px;font-size:14px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.node.core{background:var(--carbon);border-color:var(--carbon);color:var(--on-carbon)}
.node.helper{border-left:4px solid var(--ink)}
.node.tool{border-left:4px solid var(--buy)}
.node small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.node.core small{color:var(--on-carbon);opacity:.8}
@media (max-width:900px){.flow{grid-template-columns:1fr}.flow .arrow{transform:rotate(90deg);height:26px}}
.hood{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
@media (max-width:760px){.hood{grid-template-columns:1fr}}
.hood article{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.hood dl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 12px;font-size:14px;margin:10px 0 0}
.hood dt{color:var(--muted)}
.hood dd{margin:0}
.hood ul{margin:0;padding-left:18px}
.total{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;padding:14px 0 0;margin-top:14px;border-top:1px solid var(--line)}
.total b{font-family:var(--display);font-stretch:100%;font-weight:850;font-size:26px;font-variant-numeric:tabular-nums}

/* agents */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);margin-bottom:18px}
.kpis div{padding:12px 16px;border-right:1px solid var(--line);min-width:0}
.kpis div:last-child{border-right:0}
.kpis b{display:block;font-family:var(--display);font-stretch:100%;font-weight:850;font-size:24px;font-variant-numeric:tabular-nums}
.kpis span{font-size:13px;color:var(--muted)}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis div:nth-child(2){border-right:0}.kpis div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.feed{display:flex;flex-direction:column;gap:12px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.card.done{opacity:.62}
.card .who{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.card .who b{color:var(--ink)}
.card h3{font-size:17px}
.draft{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--paper);font-size:15px;white-space:pre-wrap}
.card textarea{width:100%;min-height:96px;border:1.5px solid var(--ink);border-radius:var(--r);padding:10px 12px;background:var(--paper);resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.card .acts{display:flex;gap:8px;flex-wrap:wrap}
.status{font-weight:700;font-size:14px}
.phone{background:var(--ink);color:var(--paper);border-radius:22px;padding:14px;min-height:340px;display:flex;flex-direction:column;gap:8px}
.phone .bar{display:flex;justify-content:space-between;font-size:12.5px;opacity:.8;padding:0 4px 6px;border-bottom:1px solid rgba(127,127,127,.35)}
.bubble{align-self:flex-end;background:var(--carbon);color:var(--on-carbon);padding:8px 12px;border-radius:14px 14px 4px 14px;font-size:14px;max-width:92%;white-space:pre-wrap}
.bubble small{display:block;font-size:11.5px;opacity:.75;margin-bottom:2px}
.logline{font-size:13.5px;padding:6px 10px;border-radius:8px;background:rgba(127,127,127,.18)}
.phone .empty{opacity:.7;font-size:14px;margin:auto;text-align:center;max-width:24em}

/* onboarding */
form.ob{display:flex;flex-direction:column;gap:18px}
.field label{display:block;font-weight:700;margin-bottom:4px}
.field .hint{font-size:13.5px;color:var(--muted);margin-bottom:6px}
.field input[type=text],.field textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--sheet)}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--ink);outline:none}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick label{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:14px;background:var(--sheet)}
.pick input{accent-color:var(--ink)}
.pick label:has(input:checked){border-color:var(--ink)}
.progress{font-size:15px;font-weight:650}

/* judges */
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.cols3{grid-template-columns:1fr}}
.prose{max-width:46em;color:var(--ink-2)}
.prose p+p{margin-top:10px}
table.plain{border-collapse:collapse;width:100%;font-size:14.5px}
table.plain th,table.plain td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.plain th{font-weight:700;color:var(--muted);font-size:13.5px}
.scroll{overflow-x:auto}
.scroll table{min-width:620px}
.roadmap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:860px){.roadmap{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.roadmap{grid-template-columns:1fr}}
.roadmap article{border-top:4px solid var(--ink);background:var(--sheet);padding:14px;border-radius:0 0 var(--r) var(--r)}
.roadmap h3{font-size:16px;margin-bottom:6px}
.roadmap ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2)}
.lanes{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.lane{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.lane h3{font-size:14px;font-family:var(--body);font-weight:700;color:var(--muted);margin-bottom:8px}
.lane ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lane li{display:flex;align-items:center;gap:8px;min-width:0}
.lane li+li::before{content:"\2192";color:var(--muted)}
.lane .node{font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r);font-weight:650;box-shadow:var(--shadow);z-index:40;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Fit Score: computed in code from published facts, never by the model. */
const FACTORS = [
  {key:"stack", label:"Fits your tools", max:30},
  {key:"trade", label:"Fits your trade", max:20},
  {key:"cost", label:"Cost for your size", max:15},
  {key:"contract", label:"Easy to leave", max:10},
  {key:"data", label:"States data use", max:10},
  {key:"control", label:"You stay in control", max:10},
  {key:"evidence", label:"Evidence", max:5}
];
function fitScore(t, b){
  const mine = (b.tools||[]).map(norm);
  const has = x => mine.some(m => m && (m.includes(norm(x)) || norm(x).includes(m)));
  const f = {};
  if (t.platform && has(t.platform)) f.stack = [30, "Part of " + t.platform + ", which you already use"];
  else { const w = (t.works||[]).find(has); f.stack = w ? [20, "Works with " + w + ", which you use"] : [5, "Does not connect to the tools you listed"]; }
  f.trade = t.trades.includes(b.tradeKey) ? [20, "Built for shops like yours"] : (t.trades.includes("any") || (b.tradeKey==="home" && t.trades.includes("home"))) ? [12, "General purpose"] : [0, "Built for a different kind of business"];
  const cost = t.monthly == null ? null : t.monthly * (t.perUser ? (b.seats||1) : 1);
  f.cost = cost == null ? [4, "Price only on a sales call or per use"] : cost <= 50 ? [15, money(cost) + " a month"] : cost <= 150 ? [10, money(cost) + " a month"] : cost <= 350 ? [6, money(cost) + " a month"] : [2, money(cost) + " a month for a shop your size"];
  f.contract = {none:[10,"Billed monthly, no contract found"], published:[8,"Cancel terms published"], annual:[5,"Annual contract"], multi:[0,"Multi-year contract"], unknown:[4,"Contract terms not published"]}[t.contract];
  f.data = t.data === "stated" ? [10, "Says whether your data trains its models"] : [3, "Data terms not published or not found"];
  f.control = {approve:[10,"You approve before it acts"], auto:[4,"Acts on its own"], unknown:[5,"Not stated whether you approve first"], na:[6,"Software you operate yourself"]}[t.control];
  f.evidence = {independent:[5,"Independent study"], thirdparty:[3,"Third-party review"], vendor:[2,"Vendor's own claims only"]}[t.evidence];
  const total = FACTORS.reduce((s,x)=>s+f[x.key][0],0);
  return {total, f};
}

/* ------------------------------------------------------------------ stack */
function defaultStack(b){
  const s = {helpers:[], tools:[]};
  for (const o of OPPS){ const x = b.opps?.[o.id]; if(!x) continue;
    if (x.verdict==="build") (x.helpers||[]).forEach(h=>{ if(HELPERS[h] && !s.helpers.includes(h)) s.helpers.push(h); });
    if ((x.verdict==="turnon"||x.verdict==="buy") && x.tool && !s.tools.includes(x.tool)) s.tools.push(x.tool);
  }
  return s;
}
function stackOf(b){ if(!state.stacks[b.id]) state.stacks[b.id] = defaultStack(b); return state.stacks[b.id]; }
function toggleTool(id){ const s=stackOf(curBiz()); const i=s.tools.indexOf(id); i<0?s.tools.push(id):s.tools.splice(i,1); save(); toast(i<0?"Added to your stack":"Removed from your stack"); render(); }
function toggleHelper(id){ const s=stackOf(curBiz()); const i=s.helpers.indexOf(id); i<0?s.helpers.push(id):s.helpers.splice(i,1); save(); toast(i<0?HELPERS[id].name+" added to your stack":HELPERS[id].name+" removed"); render(); }

function viewAgents(){

  const fastest = approved.length ? Math.min(...approved.map(c=>c.decidedAt-c.created)) : null;
  const pending = cards.filter(c=>c.status==="pending");
  const order = [...pending, ...decided];
  return `<div class="viewhead"><div><h2>Helpers at work</h2><p>Each helper drafts a card. You approve, edit or skip it. Code, not the model, sends only what you approved, and checks your rules first.</p></div>

function simLabel(b){ const h=b.events?.[0]?.helper; return h==="callback"?"missed call":h==="pricewatch"?"invoice":h==="catering"?"catering request":h==="inquiry"?"lead":"event"; }
function fmtDur(ms){ const s=Math.max(1,Math.round(ms/1000)); return s<60? s+" sec" : Math.round(s/60)+" min"; }

function cardHTML(c, b){
  const h = c.helper && HELPERS[c.helper];
  const head = `<div class="who"><span><b>${esc(h?h.name:"Anchored")}</b>${h?" drafted this":" flagged this"}</span><span>${c.to?"To "+esc(c.to):""}</span></div><h3>${esc(c.title)}</h3>`;
  if (c.status!=="pending"){
    const label = {approved: c.channel==="locked"?"Marked as yours to handle":c.edited?"Approved with your edits":"Approved", skipped:"Skipped"}[c.status];
    return `<article class="card done">${head}<p class="draft">${esc(c.body)}</p><p class="status">${esc(label)}</p></article>`;
  }
  const editing = c.editing;
  return `<article class="card" data-card="${c.id}">${head}
    ${editing?`<label class="tiny muted" for="ed-${c.id}">Edit the draft</label><textarea id="ed-${c.id}">${esc(c.body)}</textarea>`:`<p class="draft">${esc(c.body)}</p>`}
    <p class="small" style="color:var(--ink-2)"><b>Why now:</b> ${esc(c.reason)}</p>
    <div class="checks">${(c.checks||[]).map(x=>`<span class="chip ${c.channel==="locked"?"warn":"ok"}">${esc(x)}</span>`).join("")}</div>
    <div class="acts">${c.channel==="locked"
      ? `<button class="btn sm" data-act="approve" data-id="${c.id}">I'll handle it</button>`
      : editing
        ? `<button class="btn sm" data-act="save" data-id="${c.id}">Approve edited version</button><button class="btn sm ghost" data-act="cancel" data-id="${c.id}">Cancel</button>`
        : `<button class="btn sm" data-act="approve" data-id="${c.id}">Approve: ${esc(c.action)}</button><button class="btn sm ghost" data-act="edit" data-id="${c.id}">Edit</button><button class="btn sm ghost" data-act="skip" data-id="${c.id}">Skip</button>${state.ai==="on"&&c.channel!=="list"?`<button class="linkbtn small" data-act="voice" data-id="${c.id}">Rewrite in my voice</button>`:""}`}
    </div><p class="tiny muted" data-note="${c.id}"></p></article>`;
}

function decide(id, status, body){
  const b = curBiz(), c = cardsOf(b).find(x=>x.id===id); if(!c) return;
  if (body!=null && body.trim() && body.trim()!==c.body){ c.body = body.trim(); c.edited = true; }
  c.status = status; c.decidedAt = Date.now(); c.editing = false;
  if (status==="approved" && c.channel!=="locked"){
    const log = logOf(b);
    if (c.channel==="sms") log.unshift({channel:"sms", to:c.to||"customer", body:c.body});
    else if (c.channel==="email") log.unshift({channel:"email", text:"Email to "+(c.to||"customer")+": "+c.title});
    else log.unshift({channel:"list", text:c.action+": "+c.title});
  }
  toast(status==="approved" ? (c.channel==="locked"?"Marked as yours":"Approved. "+(c.channel==="sms"?"Text sent to the simulated phone.":"Logged in the outbox.")) : "Skipped");
  render();
}

function detectTrade(text){
  const t = text.toLowerCase();
  if (/hvac|heating|plumb|electric|roof|landscap|lawn|mow|clean|handyman|pest|paint|contractor/.test(t)) return "home";
  if (/restaurant|cafe|coffee|bakery|food|kitchen|diner|pizza|taco|catering/.test(t)) return "restaurant";
  if (/store|market|bodega|deli|mart|grocery|shop/.test(t)) return "store";
  if (/coach|consult|tutor|trainer|therap|counsel|teacher/.test(t)) return "coach";
  return "other";
}
function fromTemplate(ans){
  const trade = detectTrade(ans.name+" "+ans.what);
  const base = SAMPLES.find(s=>s.tradeKey===({home:"hvac",restaurant:"restaurant",store:"store",coach:"coach"}[trade]||"hvac"));
  const [name, ...placeParts] = ans.name.split(",");
  const opps = JSON.parse(JSON.stringify(base.opps));
  if (/never post|no marketing|don't post|dont post/i.test(ans.week) && opps.marketing){ opps.marketing.isNew = true; if(opps.marketing.verdict==="skip"){opps.marketing.verdict="build"; opps.marketing.helpers=["listing"]; opps.marketing.fit=2; opps.marketing.why="You said you never post. Short updates keep your Google listing current.";} }
  return {
    id:"my-"+Date.now(), custom:true, builtBy:"template", tradeKey:trade==="other"?"any":trade, label:"Yours",
    name:name.trim()||"Your business", trade: trade==="home"?"Home services":trade==="other"?"Small business":base.trade, place:placeParts.join(",").trim()||"Not given",
    size:(ans.what.match(/crew of \d+[^,.]*|\d+ (people|staff|employees)/i)||["Not given"])[0], seats:4, revenue:"Not given",
    customers:"From your answers: "+ans.what.slice(0,90), reach:ans.reach.length?ans.reach:["Not given"], tools:ans.tools.length?ans.tools:["Paper and phone"],
    tasks:ans.week.split(/,|\band\b/).map(s=>s.trim()).filter(s=>s.length>3).slice(0,5), voice:ans.voice||base.voice,
    opps, cards: base.cards.map(c=>({...c, body:c.body.replace(new RegExp(base.name,"g"), name.trim())})), events: base.events
  };
}
async function buildWithClaude(ans){
  const helperList = Object.entries(HELPERS).map(([id,h])=>id+": "+h.job).join("\n");
  const prompt = `You set up Anchored, which helps a small business adopt AI. Read the owner's answers and reply with only one JSON object, no other text, in exactly this shape:
{"name":string,"trade":string (2 to 4 words),"tradeKey":"hvac"|"home"|"restaurant"|"store"|"coach"|"any","place":string,"size":string,"seats":number,"revenue":string,"customers":string,"reach":[string],"tools":[string],"tasks":[string, at most 5],"voice":string (one sentence in the owner's voice),
"opps":{"calls":OPP,"books":OPP,"followup":OPP,"marketing":OPP,"quotes":OPP,"reviews":OPP,"schedule":OPP,"supplies":OPP,"compliance":OPP},
"cards":[CARD, CARD, CARD]}
OPP = {"fit":0|1|2|3,"verdict":"turnon"|"buy"|"build"|"skip","helpers":[helper ids, only when verdict is build],"tool":tool id or "","why":string under 22 words,"stake":string under 12 words or "","isNew":boolean}
CARD = {"helper":helper id,"title":string under 12 words,"body":the draft message or note,"reason":string under 14 words,"checks":[2 short strings],"action":"Send text"|"Send email"|"Add to list","channel":"sms"|"email"|"list","to":string}
Rules: "turnon" only when a tool the owner already uses covers the job, and set "tool" to its id. "buy" when a tool in the catalog fits better than building, and set "tool". "build" when an Anchored helper fits. "skip" when the job is small for this business. isNew is true for a job they don't do today but could, especially marketing they have never done. Never invent statistics or prices; write "" for stake when you have no number from the answers. Card drafts never quote a price unless the owner gave it, never answer allergy questions, and customer texts end with "Reply STOP to opt out." Use names that sound like real customers.
Anchored helpers:
${helperList}
Tool catalog ids: ${TOOLS.map(t=>t.id+" ("+t.maker+" "+t.name+", "+t.cats.join("/")+")").join("; ")}

Owner's answers:
Business: ${ans.name}
What they sell: ${ans.what}
How customers reach them: ${ans.reach.join(", ")}
Tools today: ${ans.tools.join(", ")}
What eats their week: ${ans.week}
A reply in their voice: ${ans.voice}`;
  const r = await state.sample.json(prompt, {modelTier:"default"});
  return cleanProfile(r, ans);
}
function cleanProfile(r, ans){
  const str = (v, d="") => typeof v==="string" && v.trim() ? v.trim().slice(0,300) : d;
  const arr = (v, d=[]) => Array.isArray(v) ? v.filter(x=>typeof x==="string" && x.trim()).map(x=>x.trim().slice(0,80)).slice(0,6) : d;
  const fb = fromTemplate(ans);
  const opps = {};
  for (const o of OPPS){ const x = r?.opps?.[o.id] || {};
    const verdict = ["turnon","buy","build","skip"].includes(x.verdict) ? x.verdict : "skip";
    opps[o.id] = {fit: Math.max(0,Math.min(3, Number(x.fit)||0)), verdict, helpers: arr(x.helpers).filter(h=>HELPERS[h]), tool: TOOLS.some(t=>t.id===x.tool) ? x.tool : "", why: str(x.why,"No detail given."), stake: str(x.stake), isNew: !!x.isNew};
    if (verdict==="build" && !opps[o.id].helpers.length) opps[o.id].verdict = "skip";
    if ((verdict==="buy"||verdict==="turnon") && !opps[o.id].tool) opps[o.id].verdict = verdict==="turnon" ? "turnon" : "skip";
  }
  const cards = (Array.isArray(r?.cards)?r.cards:[]).slice(0,4).map(c=>({helper: HELPERS[c?.helper]?c.helper:null, title:str(c?.title,"New card"), body:str(c?.body,""), reason:str(c?.reason,""), checks:arr(c?.checks).slice(0,3), action:str(c?.action,"Approve"), channel:["sms","email","list"].includes(c?.channel)?c.channel:"list", to:str(c?.to)})).filter(c=>c.body && c.helper);
  return {...fb, builtBy:"claude", name:str(r?.name, fb.name), trade:str(r?.trade, fb.trade), tradeKey:["hvac","home","restaurant","store","coach","any"].includes(r?.tradeKey)?r.tradeKey:fb.tradeKey, place:str(r?.place, fb.place), size:str(r?.size, fb.size), seats:Math.max(1,Math.min(200,Number(r?.seats)||fb.seats)), revenue:str(r?.revenue,"Not given"), customers:str(r?.customers, fb.customers), reach:arr(r?.reach, fb.reach), tools:arr(r?.tools, fb.tools), tasks:arr(r?.tasks, fb.tasks), voice:str(r?.voice, fb.voice), opps, cards: cards.length?cards:fb.cards, events: cards.length?[{...cards[0], title:"Another "+cards[0].title.toLowerCase()}]:fb.events};
}
async function submitOnboard(form){
  const ans = {
    name: $("#ob-name").value.trim(), what: $("#ob-what").value.trim(), week: $("#ob-week").value.trim(), voice: $("#ob-voice").value.trim(),
    reach: [...form.querySelectorAll('input[name="reach"]:checked')].map(i=>i.value), tools: [...form.querySelectorAll('input[name="tools"]:checked')].map(i=>i.value)
  };
  if (!ans.name || !ans.what){ $("#ob-progress").textContent = "Add your business name and what you sell, then try again."; return; }
  const go = $("#ob-go"); go.disabled = true;
  let biz;
  if (state.ai==="on"){
    $("#ob-progress").textContent = "Claude is reading your answers. This can take up to a minute.";
    try { biz = await buildWithClaude(ans); }
    catch(e){
      if (e && (e.code==="not_granted"||e.code==="sampling_disabled")) state.ai = "off";
      $("#ob-progress").textContent = e?.code==="rate_limited" ? "Claude is busy for your account right now. Using the closest template instead." : "Claude couldn't finish, so Anchored used the closest template.";
      biz = fromTemplate(ans);
    }
  } else biz = fromTemplate(ans);
  state.custom.push(biz); state.biz = biz.id; save();
  location.hash = "#profile"; toast("Profile built for "+biz.name);
}

async function rewriteVoice(id){
  const b = curBiz(), c = cardsOf(b).find(x=>x.id===id); if(!c || !state.sample) return;
  const note = document.querySelector(`[data-note="${id}"]`); if(note) note.textContent = "Rewriting in your voice...";
  try{
    const {text} = await state.sample(`Rewrite this message so it sounds like the owner of ${b.name}, a ${b.trade}. Their voice sample: "${b.voice}". Keep every fact, time and amount exactly. Do not add prices, offers or promises. Keep it under 60 words. If the original ends with "Reply STOP to opt out." keep that ending. Reply with only the rewritten message.\n\nMessage:\n${c.body}`, {modelTier:"quick", cache:false});
    c.body = text.trim().replace(/^"|"$/g,""); c.edited = true; render();
  }catch(e){ if(note) note.textContent = e?.code==="not_granted" ? "Claude isn't allowed for this page, so the draft stays as written." : "Couldn't rewrite right now. The draft is unchanged."; if(e?.code==="not_granted"){state.ai="off";} }
}

      <tr><td>Trade templates as data</td><td>A new kind of business is a template row: interview questions, default jobs, sample cards. HVAC, stores, restaurants and coaches share every line of code.</td></tr>

      <tr><td>Row-level security</td><td>Each business sees only its own rows, enforced in the database.</td></tr>
      <tr><td>Model by task</td><td>Short replies run on the fastest model and planning runs on the most capable one. The owner never has to choose.</td></tr>
      <tr><td>Executor in code</td><td>Quiet hours, consent, allowed offers and the allergy lock are checks in code, so a tap can't approve a rule break.</td></tr>
      <tr><td>Catalog with evidence tags</td><td>Each tool fact records where it came from and when. Scores update when a fact changes.</td></tr>
    </tbody></table></div>
  </section>

  <section class="band"><h2>What's real in this prototype</h2>
    <div class="scroll" style="margin-top:12px"><table class="plain"><thead><tr><th>Part</th><th>Status</th></tr></thead><tbody>
      <tr><td>Onboarding for any business</td><td>Real when opened in Claude: Claude reads the answers and builds the profile, map and first cards. Elsewhere it falls back to the closest template.</td></tr>
      <tr><td>Fit Score and comparisons</td><td>Real. Computed in the page from ${TOOLS.length} tools with prices gathered Nov 6 and 7, 2026.</td></tr>
      <tr><td>Rewrite in my voice</td><td>Real when opened in Claude.</td></tr>
      <tr><td>Texts and emails</td><td>Simulated. A Twilio trial can't send custom messages, and carrier registration takes longer than a weekend.</td></tr>
      <tr><td>Connectors to Jobber, Clover, QuickBooks, Calendly</td><td>Designed, not built. CSV, photos and forwarded email come first.</td></tr>
    </tbody></table></div>
  </section>

  <section class="band"><h2>The research behind it</h2>
    <div class="prose" style="margin-top:8px"><p>Each team member took one or two trades and wrote a sourced report: how the business runs, how it sells, what it uses, where money leaks, and what Anchored should and shouldn't do.</p>
    <p>Three findings shaped the product. First, the right first job differs by trade: missed calls for HVAC, supplier invoices and the SNAP rule for corner stores, catering and food cost for restaurants, lead replies for coaches. Second, owners already pay for tools that do part of the job, so "turn on what you have" has to come before "buy". Third, approval fatigue is real, so Anchored caps requests at a few a day and tracks edits and skips instead of claiming hours saved.</p></div>
    <div class="scroll" style="margin-top:14px"><table class="plain"><thead><tr><th>Trade</th><th>Researched by</th><th>Finding that changed the design</th></tr></thead><tbody>
      <tr><td>HVAC shops</td><td>Eric</td><td>Replacement quotes of $7K to $15K close about 20% of the time before follow-up, so the second helper chases quotes.</td></tr>
      <tr><td>Coaching</td><td>Pramukh Bhushan</td><td>First contact happens in Instagram and LinkedIn DMs that no tool captures, so onboarding accepts pasted DMs.</td></tr>
      <tr><td>Corner stores and restaurants</td><td>Ricky Chen</td><td>A corner store has no lead queue. Its value is in invoices, the SNAP rule and license dates, which also avoid texting law.</td></tr>
    </tbody></table></div>
  </section>

  <section class="band"><h2>With 16 weeks</h2>
    <div class="roadmap" style="margin-top:16px">
      <article><h3>Weeks 1 to 4: pilot</h3><ul><li>10 Maryland owners through the Maryland SBDC and trade groups</li><li>Time onboarding with a stopwatch</li><li>Register real business texting</li></ul></article>
      <article><h3>Weeks 5 to 8: connectors</h3><ul><li>Jobber, Square, Clover and QuickBooks</li><li>Invoice photo accuracy on 100 real invoices</li><li>Spanish and Korean screens</li></ul></article>
      <article><h3>Weeks 9 to 12: catalog</h3><ul><li>200 tools with checked facts</li><li>Discovery agent with a review queue</li><li>Fit Score v2 adds "still in use after 30 days"</li></ul></article>
      <article><h3>Weeks 13 to 16: proof</h3><ul><li>Dollars recovered per shop, measured</li><li>Pricing test at $29 a month</li><li>Security review and audit log</li></ul></article>
    </div>
  </section>
  </div>`;
}

/* ------------------------------------------------------------------ events */
document.addEventListener("click", e=>{
  const t = e.target.closest("button, a"); if(!t) return;
  if (t.dataset.hero){ state.heroBiz = t.dataset.hero; render(); return; }
  if (t.dataset.helper){ toggleHelper(t.dataset.helper); return; }
  if (t.dataset.tool){ toggleTool(t.dataset.tool); return; }
  if (t.dataset.filter){ state.filter = t.dataset.filter; if(state.view!=="compare") location.hash="#compare"; else render(); return; }
  if (t.dataset.cmp){ const id=t.dataset.cmp, i=state.compare.indexOf(id); if(i<0){ state.compare.push(id); if(state.compare.length>3) state.compare.shift(); } else state.compare.splice(i,1); render(); if(state.compare.length>=2) $(".cmp")?.scrollIntoView({block:"nearest"}); return; }
  if (t.dataset.sim){ const b=curBiz(), ev=b.events?.[0]; if(ev){ cardsOf(b).unshift({...ev, id:"c"+(++cardSeq), status:"pending", created:Date.now(), edited:false}); toast("New card from "+(HELPERS[ev.helper]?.name||"Anchored")); render(); } return; }
  const act = t.dataset.act, id = t.dataset.id;
  if (act){
    const c = cardsOf(curBiz()).find(x=>x.id===id);
    if (act==="approve") decide(id,"approved");
    else if (act==="skip") decide(id,"skipped");
    else if (act==="edit"){ c.editing = true; render(); $("#ed-"+id)?.focus(); }
    else if (act==="cancel"){ c.editing = false; render(); }
    else if (act==="save") decide(id,"approved", $("#ed-"+id)?.value);
    else if (act==="voice") rewriteVoice(id);
  }
});
document.addEventListener("change", e=>{
  if (e.target.id==="biz-select"){ const v=e.target.value; if(v==="__new"){ location.hash="#onboard"; return; } state.biz=v; state.compare=[]; save(); render(); }
});
document.addEventListener("submit", e=>{ if(e.target.id==="ob"){ e.preventDefault(); submitOnboard(e.target); } });

function route(){
  const h = (location.hash||"#home").slice(1);
  state.view = VIEWS.includes(h) ? h : "home";
  render(); window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();

(async()=>{
  try{ const s = window.claude && await window.claude.use("sample"); state.sample = s || null; state.ai = s ? "on" : "off"; }
  catch(e){ state.ai = "off"; }
  if (["onboard","agents"].includes(state.view)) render();
})();
</script>
